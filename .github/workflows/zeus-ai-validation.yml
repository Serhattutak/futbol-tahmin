name: ZEUS AI validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, zeus-single-model-experience]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend and UI regression tests
        working-directory: backend
        run: npm test
