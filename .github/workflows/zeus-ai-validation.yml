name: ZEUS AI validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Report frontend npm audit details
        if: always()
        run: |
          npm audit --json > /tmp/frontend-npm-audit.json || true
          node <<'NODE'
          const a = require("/tmp/frontend-npm-audit.json");
          const vulnerabilities = Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, range: v.range, fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === "string" ? x : { title: x.title, url: x.url, range: x.range })
          }));
          console.log(JSON.stringify({ metadata: a.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          NODE
      - name: Enforce frontend high/critical audit threshold
        run: npm audit --audit-level=high
      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3001
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Report backend npm audit details
        if: always()
        working-directory: backend
        run: |
          npm audit --json > /tmp/backend-npm-audit.json || true
          node <<'NODE'
          const a = require("/tmp/backend-npm-audit.json");
          const vulnerabilities = Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, range: v.range, fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === "string" ? x : { title: x.title, url: x.url, range: x.range })
          }));
          console.log(JSON.stringify({ metadata: a.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          NODE
      - name: Enforce backend high/critical audit threshold
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Install Playwright for browser smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local backend and built frontend
        env:
          ZEUS_DISABLE_CAPTURE_SCHEDULER: "1"
        run: |
          CORS_ORIGINS=http://127.0.0.1:4173 npm --prefix backend start > /tmp/zeus-backend.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/zeus-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/api/health > /dev/null && curl --silent --fail http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:3001/api/health > /dev/null
          curl --silent --show-error --fail http://127.0.0.1:4173 > /dev/null
      - name: Run real-data browser and mobile-layout smoke test
        run: node .github/scripts/ui-smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ui-smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      # Keep production-provider quota use low: run the live check after a main-branch deployment.
      - name: Verify live Render API compatibility
        if: github.event_name == 'push'
        env:
          ZEUS_API_BASE_URL: https://zeus-one-betting-api.onrender.com
        run: node .github/scripts/live-api-smoke.cjs
      - name: Read-only production ledger and provider diagnostics
        if: github.event_name == 'push'
        env:
          ZEUS_API_BASE_URL: https://zeus-one-betting-api.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.ZEUS_API_BASE_URL.replace(/\/$/, "");
          const paths = ["/api/health", "/api/providers/status", "/api/capture/status", "/api/ledger/status", "/api/ledger/performance", "/api/ledger/comparison"];
          (async () => {
            for (const path of paths) {
              try {
                const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
                let body = await response.json().catch(() => null);
                if (!response.ok) throw new Error("HTTP " + response.status);
                if (path === "/api/capture/status") {
                  for (let attempt = 0; attempt < 8 && body?.isRunning; attempt++) {
                    await new Promise(resolve => setTimeout(resolve, 5000));
                    const poll = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
                    body = await poll.json().catch(() => null);
                    if (!poll.ok) throw new Error("HTTP " + poll.status);
                  }
                }
                let summary = body;
                if (path === "/api/ledger/performance" && body?.report) summary = { source: body.report.source, comparison: body.report.comparison, models: Object.fromEntries(Object.entries(body.report.models || {}).map(([key, value]) => [key, { totalPredictions: value.totalPredictions, settledPredictions: value.settledPredictions, pendingPredictions: value.pendingPredictions, conflictPredictions: value.conflictPredictions, sampleSize: value.sampleSize, accuracy: value["1X2"]?.accuracy, brier: value["1X2"]?.brier, logLoss: value["1X2"]?.logLoss, leagues: value.leagues }])) };
                if (path === "/api/ledger/comparison" && body?.comparison) summary = body.comparison;
                console.log(JSON.stringify({ path, status: response.status, data: summary }));
              } catch (error) { console.log(JSON.stringify({ path, error: error.message })); process.exitCode = 1; }
            }
          })();
          NODE
      - name: Live fixture coverage by date and league
        if: github.event_name == 'push'
        env:
          ZEUS_API_BASE_URL: https://zeus-one-betting-api.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.ZEUS_API_BASE_URL.replace(/\/$/, "");
          const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
          const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
          const today = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
          const dates = ["2026-10-11", today.toISOString().slice(0, 10), new Date(today.getTime() + 86400000).toISOString().slice(0, 10)];
          (async () => {
            for (const date of [...new Set(dates)]) {
              const response = await fetch(base + "/api/football-test?date=" + date, { signal: AbortSignal.timeout(25000) });
              const body = await response.json();
              if (!response.ok || body.success !== true || !Array.isArray(body.matches)) throw new Error("Fixture API invalid for " + date + ": HTTP " + response.status);
              const leagues = {};
              const providers = {};
              for (const match of body.matches) {
                const league = match.league?.name || "Unknown";
                leagues[league] = (leagues[league] || 0) + 1;
                for (const provider of (match.providers || match.sources || [match.provider]).filter(Boolean)) providers[provider] = (providers[provider] || 0) + 1;
              }
              console.log(JSON.stringify({ date, total: body.matches.length, source: body.source || null, stale: Boolean(body.stale), providerError: body.providerError || null, providers, leagueCounts: Object.fromEntries(Object.entries(leagues).sort((a,b)=>b[1]-a[1])) }));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Run backend and UI regression tests
        working-directory: backend
        run: npm test
      - name: Run offline historical coverage replay (no provider calls or ledger writes)
        working-directory: backend
        run: node scripts/auditHistoricalCoverageV2.js
      - name: Verify live Neon staging API (read-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/neon-durable-prediction-ledger'
        env:
          ZEUS_STAGING_API_BASE_URL: https://zeus-ai-ledger-staging.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.ZEUS_STAGING_API_BASE_URL.endsWith("/") ? process.env.ZEUS_STAGING_API_BASE_URL.slice(0, -1) : process.env.ZEUS_STAGING_API_BASE_URL;
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path, attempts = 3) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
                const body = await response.json().catch(() => null);
                if (!response.ok) throw new Error("HTTP " + response.status);
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(5000);
              }
            }
            throw lastError;
          }
          (async () => {
            let health;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                health = await get("/api/health", 1);
                break;
              } catch (error) {
                if (attempt === 12) throw error;
                await wait(5000);
              }
            }
            if (health?.status !== "ok") throw new Error("Staging health payload is invalid");
            console.log(JSON.stringify({ path: "/api/health", status: "ok" }));
            for (const path of ["/api/providers/status", "/api/capture/status", "/api/ledger/status", "/api/ledger/performance", "/api/ledger/comparison"]) {
              const body = await get(path);
              if (!body || body.success === false) throw new Error(path + " returned an unsuccessful payload");
              if (path === "/api/capture/status" && body.storage?.mode !== "neon_postgres") {
                throw new Error("Staging capture status is not reporting Neon storage");
              }
              if (path === "/api/ledger/status" && (!Number.isInteger(body.total) || body.total < 0)) {
                throw new Error("Staging ledger total must be a non-negative integer");
              }
              console.log(JSON.stringify({ path, success: true, storageMode: body.storage?.mode || undefined, total: body.total }));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Verify staging fixture coverage by date and league
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/neon-durable-prediction-ledger'
        env:
          ZEUS_STAGING_API_BASE_URL: https://zeus-ai-ledger-staging.onrender.com
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const base = process.env.ZEUS_STAGING_API_BASE_URL.replace(/\/$/, "");
          const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
          const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
          const today = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
          const dates = [...new Set(["2025-10-12", today.toISOString().slice(0, 10), new Date(today.getTime() + 86400000).toISOString().slice(0, 10)])];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function getDate(date) {
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(base + "/api/football-test?date=" + date, { signal: AbortSignal.timeout(25000) });
                const body = await response.json();
                assert.equal(response.status, 200, "fixture API should return HTTP 200 for " + date);
                assert.equal(body.success, true, "fixture API should succeed for " + date);
                assert.equal(body.date, date, "fixture API should preserve the requested date");
                assert.ok(Array.isArray(body.matches), "matches must be an array");
                assert.equal(body.results, body.matches.length, "result count must match fixture array length");
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < 4) await wait(attempt * 3000);
              }
            }
            throw lastError;
          }
          (async () => {
            const checks = [];
            for (const date of dates) {
              const body = await getDate(date);
              const leagues = [...new Set(body.matches.map(match => match.league?.name).filter(Boolean))].sort();
              const providers = [...new Set(body.matches.flatMap(match => match.providers || match.sources || [match.provider]).filter(Boolean))].sort();
              checks.push({ date, results: body.results, source: body.source || null, stale: Boolean(body.stale), providerError: body.providerError || null, leagueCount: leagues.length, leagues, providers });
            }
            assert.ok(checks[0].results > 0, "known historical date 2025-10-12 must contain real fixtures");
            console.log(JSON.stringify({ ok: true, fixtureCoverage: checks }));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  neon-ledger-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install PostgreSQL driver for isolated integration test
        working-directory: backend
        run: npm install --no-save --package-lock=false pg
      - name: Verify real PostgreSQL persistence and restore
        working-directory: backend
        env:
          ZEUS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zeus_test
        run: node --test services/neonPredictionLedgerStore.integration.test.js
